<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hushtype</title>
<style>
/* Layout: glass sidebar + content on a ground with soft colour glows. Dark and light themes,
   plus a truck-art look (Pakistani truck painting) for Urdu and Punjabi. */
:root {
  color-scheme: dark;
  --w08: rgba(255,255,255,0.08);
  --w10: rgba(255,255,255,0.1);
  --w10: rgba(255,255,255,0.10);
  --w12: rgba(255,255,255,0.12);
  --w13: rgba(255,255,255,0.13);
  --w14: rgba(255,255,255,0.14);
  --w15: rgba(255,255,255,0.15);
  --w16: rgba(255,255,255,0.16);
  --w18: rgba(255,255,255,0.18);
  --w20: rgba(255,255,255,0.2);
  --w22: rgba(255,255,255,0.22);
  --w25: rgba(255,255,255,0.25);
  --w30: rgba(255,255,255,0.3);
  --w32: rgba(255,255,255,0.32);
  --w35: rgba(255,255,255,0.35);
  --w45: rgba(255,255,255,0.45);
  --w50: rgba(255,255,255,0.5);
  --w62: rgba(255,255,255,0.62);
  --w78: rgba(255,255,255,0.78);
  --w93: rgba(255,255,255,0.93);
  --danger-text: #FFE4E4;
  --dialog: rgba(30,38,60,.72);
  --toast: rgba(20,26,42,.9);
  --glow-a: .7; --glow-b: .65; --glow-c: .5;
  --shadow: rgba(4,8,20,.35);
  --orb-inner: rgba(255,255,255,.93);
  --ground: #0B1220;
  --text: #FFFFFF;
  --muted: var(--w78);
  --faint: var(--w62);
  --glass: var(--w10);
  --glass-strong: var(--w16);
  --edge: var(--w22);
  --edge-strong: var(--w32);
  --shine: inset 0 1px 0 var(--w32);
  --accent: #2DD4BF;
  --accent-glow: rgba(45,212,191,0.45);
  --rec: #F87171;
  --warn: #FDBA74;
  --solid: var(--w93);
  --solid-text: #0B1220;
  --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
  --urdu: "Noto Nastaliq Urdu", "Urdu Typesetting", "Jameel Noori Nastaleeq", "Segoe UI", serif;
}

:root[data-theme="light"] {
  color-scheme: light;
  --w08: rgba(15,23,42,0.044);
  --w10: rgba(15,23,42,0.055);
  --w10: rgba(15,23,42,0.055);
  --w12: rgba(15,23,42,0.066);
  --w13: rgba(15,23,42,0.072);
  --w14: rgba(15,23,42,0.077);
  --w15: rgba(15,23,42,0.083);
  --w16: rgba(15,23,42,0.088);
  --w18: rgba(15,23,42,0.099);
  --w20: rgba(15,23,42,0.11);
  --w22: rgba(15,23,42,0.121);
  --w25: rgba(15,23,42,0.138);
  --w30: rgba(15,23,42,0.165);
  --w32: rgba(15,23,42,0.176);
  --w35: rgba(15,23,42,0.193);
  --w45: rgba(15,23,42,0.248);
  --w50: rgba(15,23,42,0.275);
  --w62: rgba(15,23,42,0.341);
  --w78: rgba(15,23,42,0.429);
  --w93: rgba(15,23,42,0.512);
  --ground: #EEF2F7;
  --text: #0F172A;
  --muted: rgba(15,23,42,.72);
  --faint: rgba(15,23,42,.55);
  --glass: rgba(255,255,255,.62);
  --glass-strong: rgba(255,255,255,.85);
  --edge: rgba(15,23,42,.10);
  --edge-strong: rgba(15,23,42,.18);
  --shine: inset 0 1px 0 rgba(255,255,255,.95);
  --accent: #0D9488;
  --accent-glow: rgba(13,148,136,.35);
  --rec: #DC2626;
  --warn: #C2410C;
  --solid: #0F172A;
  --solid-text: #FFFFFF;
  --danger-text: #B91C1C;
  --dialog: rgba(255,255,255,.92);
  --toast: rgba(255,255,255,.96);
  --glow-a: .35; --glow-b: .3; --glow-c: .25;
  --shadow: rgba(15,23,42,.12);
  --orb-inner: #FFFFFF;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--text); font: 14px/1.5 var(--font); overflow: hidden; user-select: none; }
.glow { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(10px); }
.g1 { width: 620px; height: 620px; left: -140px; top: -180px; background: radial-gradient(circle, rgba(45,212,191,var(--glow-a)), transparent 68%); }
.g2 { width: 720px; height: 720px; right: -200px; top: 60px; background: radial-gradient(circle, rgba(129,140,248,var(--glow-b)), transparent 68%); }
.g3 { width: 600px; height: 600px; left: 28%; bottom: -320px; background: radial-gradient(circle, rgba(251,146,60,var(--glow-c)), transparent 68%); }
.app { position: relative; display: flex; gap: 18px; padding: 18px; height: 100%; }
.glass { background: var(--glass); backdrop-filter: blur(32px) saturate(170%); border: 1px solid var(--edge); box-shadow: var(--shine); }

nav { flex: 0 0 236px; border-radius: 26px; padding: 22px 14px; display: flex; flex-direction: column; gap: 26px; box-shadow: var(--shine), 0 24px 60px var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font: 700 20px var(--display); letter-spacing: -.01em; }
.navlist { display: flex; flex-direction: column; gap: 4px; }
.navlist button { all: unset; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; color: var(--muted); font-weight: 500; cursor: pointer; }
.navlist button:hover { background: var(--w08); color: var(--text); }
.navlist button[aria-current="page"] { background: var(--w20); color: var(--text); font-weight: 600; box-shadow: var(--shine); }
.navlist button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { margin-top: auto; padding: 14px; border-radius: 18px; background: var(--w08); border: 1px solid var(--w16); font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.dot.rec { background: var(--rec); box-shadow: 0 0 10px var(--rec); }
.dot.busy { background: #A5B4FC; box-shadow: 0 0 10px #A5B4FC; }
.dot.off { background: var(--warn); box-shadow: 0 0 10px var(--warn); }

main { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 14px clamp(6px, 2.4vw, 34px) 40px; }
main::-webkit-scrollbar { width: 10px; } main::-webkit-scrollbar-thumb { background: var(--w18); border-radius: 10px; }
.view { display: flex; flex-direction: column; gap: 18px; max-width: 1040px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
h1 { margin: 0; font: 600 30px var(--display); letter-spacing: -.02em; }
h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sub { margin: 0; color: var(--muted); font-size: 14.5px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { border-radius: 24px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spread { justify-content: space-between; }
.chip { padding: 5px 12px; border-radius: 999px; background: var(--w13); border: 1px solid var(--w20); font-size: 12.5px; white-space: nowrap; }
.tag { padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid; }
.tag.en { background: rgba(94,234,212,.2); border-color: rgba(94,234,212,.45); }
.tag.ur { background: rgba(251,146,60,.22); border-color: rgba(253,186,116,.5); }
.tag.pa { background: rgba(244,114,182,.22); border-color: rgba(249,168,212,.5); }
.mono { font-family: var(--mono); }
.urdu { font-family: var(--urdu); direction: rtl; text-align: right; line-height: 2.1; font-size: 1.12em; }

button { font: inherit; color: inherit; }
.btn { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--edge-strong); background: var(--glass-strong); box-shadow: var(--shine); color: var(--text); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { background: var(--w22); }
.btn.solid { background: var(--solid); color: var(--solid-text); border: 0; font-weight: 600; box-shadow: 0 6px 18px rgba(4,8,20,.28); }
.btn.solid:hover { filter: brightness(1.08); }
.btn.danger { background: rgba(248,113,113,.18); border-color: rgba(254,202,202,.5); color: var(--danger-text); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--w12); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--w22); }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--w12); border: 1px solid var(--edge); box-shadow: var(--shine); }
.seg button { border: 0; border-radius: 999px; padding: 0 18px; min-height: 38px; background: transparent; color: var(--text); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.seg button[aria-pressed="true"] { background: var(--solid); color: var(--solid-text); font-weight: 600; box-shadow: 0 4px 14px rgba(4,8,20,.25); }
select, input[type=text], input[type=search], textarea { font: inherit; color: var(--text); background: var(--w13); border: 1px solid var(--edge-strong); border-radius: 14px; min-height: 42px; padding: 0 14px; box-shadow: var(--shine); user-select: text; }
textarea { padding: 10px 14px; resize: vertical; min-height: 70px; }
input::placeholder, textarea::placeholder { color: var(--faint); }
select option { color: #0B1220; background: #FFFFFF; }
.switch { width: 50px; height: 30px; border-radius: 999px; border: 1px solid var(--w30); background: var(--w16); padding: 2px; display: flex; justify-content: flex-start; cursor: pointer; flex: 0 0 auto; }
.switch::after { content: ""; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(4,8,20,.3); }
.switch[aria-pressed="true"] { background: var(--accent); border-color: transparent; justify-content: flex-end; box-shadow: 0 0 14px var(--accent-glow); }
.setting { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--w12); }
.setting:last-child { border-bottom: 0; }
.setting .label { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.setting .label b { font-weight: 500; font-size: 15px; }
.setting .label span { font-size: 13px; color: var(--muted); }
.setting select { min-width: 220px; }
.meter { flex: 1 1 auto; height: 10px; border-radius: 999px; background: var(--w14); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #5EEAD4, #A5B4FC); box-shadow: 0 0 12px rgba(94,234,212,.6); transition: width .08s linear; }

/* home */
.hero { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 30px; padding: 32px; border-radius: 28px; box-shadow: var(--shine), 0 30px 70px rgba(4,8,20,.3); }
.orb { width: 112px; height: 112px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: var(--w14); border: 1px solid var(--w30); box-shadow: inset 0 1px 0 var(--w50), 0 0 40px rgba(94,234,212,.35); transition: box-shadow .2s; }
button.orb { padding: 0; cursor: pointer; color: inherit; font: inherit; }
.orb > div { flex: 0 0 76px; min-width: 76px; }
button.orb:hover > div { transform: scale(1.05); box-shadow: 0 10px 30px rgba(4,8,20,.4); }
button.orb:active > div { transform: scale(.97); }
button.orb:disabled { cursor: default; opacity: .7; }
.orb > div { transition: transform .12s, background .15s; height: 76px; border-radius: 50%; background: var(--orb-inner); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(4,8,20,.3); }
.orb.rec > div { background: #F87171; }
.orb.rec { box-shadow: inset 0 1px 0 var(--w50), 0 0 50px rgba(248,113,113,.6); animation: pulse 1.2s ease-in-out infinite; }
.orb.busy { box-shadow: inset 0 1px 0 var(--w50), 0 0 50px rgba(165,180,252,.6); }
@keyframes pulse { 50% { transform: scale(1.05); } }
kbd { font-family: var(--mono); font-size: .8em; padding: 3px 10px; border-radius: 9px; background: var(--w18); border: 1px solid var(--w35); box-shadow: inset 0 1px 0 var(--w45), 0 3px 0 rgba(4,8,20,.25); white-space: nowrap; }
.hero h2 { font: 600 25px var(--display); letter-spacing: -.01em; }
.big-text { margin: 0; font-size: 17px; line-height: 1.6; white-space: pre-wrap; user-select: text; }
.meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tile { border-radius: 20px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px; }
.tile span { font-size: 13px; color: var(--muted); }
.tile b { font: 600 28px var(--display); font-variant-numeric: tabular-nums; }
.howto { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 22px; }
.how { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--w10); }
.how .k { flex: 0 0 200px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; }
.how p { margin: 0; color: var(--muted); font-size: 13.5px; }
.how p b { color: var(--text); font-weight: 600; }

/* history & projects */
.list { border-radius: 24px; display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--w12); align-items: start; }
.item:last-child { border-bottom: 0; }
.item .when { display: flex; flex-direction: column; gap: 6px; font-size: 13px; align-items: flex-start; }
.item .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.item .text { margin: 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.item .actions { display: flex; gap: 6px; align-items: center; }
.item select { min-height: 34px; font-size: 12.5px; padding: 0 8px; border-radius: 10px; min-width: 0; max-width: 130px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pcard { border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; min-height: 150px; }
.pcard:hover { background: var(--w15); }
.pcard h3 { margin: 0; font: 600 18px var(--display); display: flex; align-items: center; gap: 10px; }
.pcard.new { align-items: center; justify-content: center; border-style: dashed; color: var(--muted); font-weight: 500; }
.combined { margin: 0; padding: 22px 26px; border-radius: 24px; font-size: 16px; line-height: 1.75; white-space: pre-wrap; user-select: text; }

/* dialogs & toast */
.backdrop { position: fixed; inset: 0; background: rgba(5,8,18,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.dialog { width: min(520px, 100%); max-height: 90vh; overflow-y: auto; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 16px; background: var(--dialog); backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--edge-strong); box-shadow: var(--shine), 0 30px 80px rgba(4,8,20,.5); }
.dialog h2 { font: 600 22px var(--display); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--toast); border: 1px solid var(--edge-strong); box-shadow: 0 10px 30px rgba(4,8,20,.5); z-index: 60; font-weight: 500; }
.snip { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.wordchip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--w15); border: 1px solid var(--w25); }
.wordchip button { width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--w15); color: var(--text); cursor: pointer; }

/* ---------- Truck art (Urdu & Punjabi) ---------- */
:root[data-art="truck"] {
  --chamak: repeating-linear-gradient(135deg, #FF2E88 0 12px, #FFC600 12px 24px, #00B34A 24px 36px, #00A3E0 36px 48px, #E4002B 48px 60px);
  --art-ground: #1A0B33;
  --art-card: #22103F;
  --art-card-2: #2D1652;
  --accent: #00C853;
  --accent-glow: rgba(0,200,83,.5);
  --solid: #FFC600;
  --solid-text: #1A0B33;
}
:root[data-art="truck"][data-theme="light"] {
  --art-ground: #FFE27A;
  --art-card: #FFFBEF;
  --art-card-2: #FFF3CC;
  --accent: #00963E;
  --solid: #D6006A;
  --solid-text: #FFFFFF;
}
[data-art="truck"] body {

  const l = S.live || { state: "loading", message: "Starting..." };
  const cls = { recording: "rec", working: "busy", model: "busy", loading: "busy", error: "off" }[l.state] || "";
  const label = { idle: "Ready", recording: "Listening", working: "Transcribing", model: "Preparing model", loading: "Starting", error: "Needs attention" }[l.state];
  const p = l.project && l.project.name ? l.project : activeProject();
  $("#side-status").innerHTML = `<div class="row" style="gap:8px"><span class="dot ${cls}"></span><b>${label}</b></div>
    <div style="color:var(--muted)">${esc(p.name)} · ${esc((S.options.languages || {})[l.language || p.language] || "")}<br>Offline on this laptop</div>
    <div style="color:var(--faint);font-size:12px">Version ${esc(S.versionStr || "")}</div>`;
}

/* ---------------- views ---------------- */
function render() {
  applyTheme();
  const v = { home: viewHome, history: viewHistory, projects: viewProjects, project: viewProject, languages: viewLanguages, settings: viewSettings }[S.view];
  $("#main").innerHTML = `<div class="view">${v()}</div>`;
  if (S.view === "history" || S.view === "project") loadHistory();
  if (S.view === "settings") startMeter(); else stopMeter();
  if (S.view === "languages") loadLanguages();
}

function langToggle() {
  const lang = activeProject().language;
  const exp = (S.options.experimental || []);
  return `<div class="seg" role="group" aria-label="Language for ${esc(activeProject().name)}">
    <button type="button" data-lang="auto" aria-pressed="${lang === "auto"}" title="Hushtype hears which language you speak">Auto</button>
    ${enabledLangs().map((l) => `<button type="button" data-lang="${l}" aria-pressed="${lang === l}"${exp.includes(l) ? ' title="Experimental"' : ""}>${langLabel(l)}</button>`).join("")}</div>`;
}
function projectSelect(id = "active-project") {
  return `<label for="${id}" class="eyebrow" style="position:absolute;left:-9999px">Active project</label>
   <select id="${id}" data-active-project>${S.projects.map((p) => `<option value="${p.id}" ${p.id === S.settings.active_project ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`;
}

function orbInner() {
  const rec = S.live && S.live.state === "recording";
  const stop = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3" fill="#FFFFFF"/></svg>';
  return `<div>${rec ? stop : icon("mic", 30, "#0B1220")}</div>`;
}

function heroContent() {
  const l = S.live || { state: "loading", message: "Starting..." };
  const k = keysKbd();
  if (l.state === "recording") return `<h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">Listening <span class="mono" id="hero-timer">${fmtDur(l.elapsed)}</span>${countdownHtml(l)}</h2><p class="sub">${l.hands_free ? `Hands-free. Press ${k} again to finish.` : (l.from_app ? "Click the button again to finish. The text will be copied." : S.settings.auto_paste ? "Let go to paste." : "Let go and the text is copied.")}</p>`;
  if (l.state === "working") return `<h2>Transcribing...</h2><p class="sub">${S.settings.auto_paste ? "Your text will appear where your cursor is." : "Your text will be copied, ready for Ctrl+V."}</p>`;
  if (l.state === "model" || l.state === "loading") {
    const lang = Object.keys(l.downloads || {})[0];
    return `<h2>${esc(l.message || "Starting...")}</h2>${lang ? downloadBar(lang) : ""}<p class="sub">${lang ? "This download happens only once. After that the model loads from your laptop, offline." : "One moment."}</p>`;
  }
  if (l.state === "error") return `<h2>Hushtype needs attention</h2><p class="sub">${esc(l.message)}</p><div><button class="btn solid" data-go="settings">Open Settings</button></div>`;
  return `<h2>Hold ${k} and speak</h2><p class="sub" style="max-width:58ch">${S.settings.auto_paste ? "Let go and your words are typed where your cursor is." : "Let go and your words are copied. Press <b>Ctrl+V</b> to paste them anywhere: LinkedIn, Gmail, Outlook."} Punctuation is added automatically. You can also click the microphone.</p>`;
}

function viewHome() {
  const p = activeProject(), st = S.stats || {}, last = S.last, l = S.live || {};
  const orb = l.state === "recording" ? "rec" : (l.state === "working" || l.state === "model") ? "busy" : "";
  const snippets = Object.keys(S.settings.snippets || {});
  return `
  <header class="top"><div><h1>Home</h1><p class="sub">Dictate anywhere on your PC. Everything stays on this laptop.</p></div>
    <div class="row">${projectSelect()}${langToggle()}</div></header>

  <section class="glass card hero" aria-live="polite">
    <button type="button" class="orb ${orb}" id="orb" data-record aria-label="${l.state === "recording" ? "Stop recording" : "Start recording"}" title="Click to dictate here. The text is copied for you to paste.">${orbInner()}</button>
    <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px" id="hero">${heroContent()}</div>
    <div class="row" style="flex-basis:100%;gap:8px">
      <span class="chip"><span class="pdot" style="background:${PCOLORS[p.color] || PCOLORS.teal}"></span> ${esc(p.name)}</span>
      <span class="chip">${esc(S.options.languages[p.language])}</span>
      ${p.language === "auto" ? `<span class="chip">Detects English or ${S.settings.auto_other === "pa" ? "Punjabi" : "Urdu"}</span>` : `<span class="chip">Model: ${esc((S.options.models[p.language === "pa" ? "ur" : p.language] || {})[S.settings[(p.language === "pa" ? "ur" : p.language) + "_model"]] || "")}</span>`}
      ${p.language === "pa" ? '<span class="chip">Punjabi is experimental</span>' : ""}
      ${st.avg_wait != null ? `<span class="chip">Avg. wait ${st.avg_wait.toFixed(1)} s</span>` : ""}
    </div>
  </section>

  <section class="glass card" aria-labelledby="last-h">
    <div class="row spread"><h2 id="last-h" class="eyebrow">Last dictation</h2>
      ${last ? `<div class="row"><button class="btn" data-copy-last>${icon("copy", 16)}Copy</button><button class="btn ghost" data-go="history">Open history</button></div>` : ""}</div>
    ${last ? `<p class="big-text ${RTL(last.language) ? "urdu" : ""}">${esc(last.text)}</p>
      <div class="meta"><span>${dayLabel(last.created_at)} ${fmtTime(last.created_at)}</span><span class="mono">${fmtDur(last.duration)} recorded</span><span class="mono">${last.process_time.toFixed(1)} s to transcribe</span>${last.app ? `<span>Pasted into ${esc(last.app)}</span>` : ""}</div>`
      : `<p class="sub">Nothing yet. Click into any text box, hold ${esc(keyName())} and say something.</p>`}
  </section>

  <section class="tiles" aria-label="Your numbers">
    <div class="glass tile"><span>Dictations today</span><b>${st.today ?? 0}</b></div>
    <div class="glass tile"><span>Words this week</span><b>${(st.week_words ?? 0).toLocaleString()}</b></div>
    <div class="glass tile"><span>Time recorded this week</span><b>${Math.round((st.week_seconds ?? 0) / 60)} min</b></div>
  </section>

  <section class="glass card" aria-labelledby="how-h">
    <h2 id="how-h">How to use Hushtype</h2>
    <div class="howto">
      <div class="how"><div class="k">Hold ${keysKbd()}</div><p><b>Dictate.</b> Speak while holding and let go. The text is copied: press Ctrl+V to paste it anywhere. Or click the microphone above.</p></div>
      <div class="how"><div class="k">${isCombo() ? `<kbd>${esc(modName())}</kbd> + <kbd>${esc(keyParts()[1])}</kbd><kbd>${esc(keyParts()[1])}</kbd>` : `<kbd>${esc(keyName())}</kbd><kbd>${esc(keyName())}</kbd>`}</div><p><b>Hands-free.</b> ${isCombo() ? `Hold ${esc(modName())} and double-tap ${esc(keyParts()[1])}` : "Double-tap"} to keep recording without holding. Press the shortcut again to finish.</p></div>
      <div class="how"><div class="k"><kbd>${esc(modName())}</kbd> + <kbd>L</kbd></div><p><b>Switch language</b> of the active project: Auto, English, Urdu, Punjabi. Auto hears which one you speak.</p></div>
      <div class="how"><div class="k"><kbd>${esc(modName())}</kbd> + <kbd>V</kbd></div><p><b>Copy again.</b> Copies your last dictation again, if you copied something else in between.</p></div>
      <div class="how"><div class="k"><span class="chip">"new line"</span><span class="chip">"new paragraph"</span></div><p><b>Line breaks.</b> Say these while dictating. Commas, full stops and question marks are added automatically.</p></div>
      <div class="how"><div class="k">${snippets.length ? snippets.slice(0, 2).map((s) => `<span class="chip">"${esc(s)}"</span>`).join("") : '<span class="chip">Snippets</span>'}</div><p><b>Snippets.</b> Say a trigger to insert saved text. <button class="btn ghost" style="min-height:0;padding:0" data-go="settings">Edit snippets</button></p></div>
      <div class="how"><div class="k"><span class="chip">Projects</span></div><p><b>Stay organised.</b> Dictations go to the active project, or to the project whose app rule matches (Outlook goes to Email).</p></div>
      <div class="how"><div class="k"><span class="chip">Tray icon</span></div><p><b>Always running.</b> Closing this window keeps Hushtype in the tray. Right-click the icon to quit.</p></div>
    </div>
  </section>`;
}

function historyFilters(showProject) {
  return `<div class="row">
    <label for="hq" style="position:absolute;left:-9999px">Search</label>
    <input id="hq" type="search" placeholder="Search your dictations" value="${esc(S.hq)}" style="flex:1 1 260px;min-width:0;border-radius:999px">
    ${showProject ? `<label for="hproj" style="position:absolute;left:-9999px">Project</label><select id="hproj"><option value="">All projects</option>${S.projects.map((p) => `<option value="${p.id}" ${String(p.id) === String(S.hproj) ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>` : ""}
    <div class="seg" role="group" aria-label="Language filter">
      ${[["", "All"], ...enabledLangs().map((l) => [l, langName(l)])].map(([k, l]) => `<button type="button" data-hlang="${k}" aria-pressed="${S.hlang === k}">${l}</button>`).join("")}
    </div></div>`;
}

function viewHistory() {
  return `<header class="top"><div><h1>History</h1><p class="sub">${S.settings.save_history ? "Saved on this laptop only." : "History is turned off in Settings."} ${S.stats.total ?? 0} dictations.</p></div>
    <button class="btn danger" data-clear-all ${S.stats.total ? "" : "disabled"}>Delete all</button></header>
    ${historyFilters(true)}
    <div id="hist"><p class="sub">Loading...</p></div>`;
}

function itemHtml(d) {
  const p = projectById(d.project_id);
  return `<article class="item">
    <div class="when"><span class="mono">${fmtTime(d.created_at)}</span><span class="tag ${d.language}">${d.language.toUpperCase()}</span></div>
    <div class="body" id="body-${d.id}"><p class="text ${RTL(d.language) ? "urdu" : ""}">${esc(d.text)}</p>
      <div class="meta"><span><span class="pdot" style="background:${PCOLORS[p.color] || PCOLORS.teal}"></span> ${esc(p.name)}</span><span class="mono">${fmtDur(d.duration)} recorded</span><span class="mono">${d.process_time.toFixed(1)} s wait</span>${d.app ? `<span>${esc(d.app)}</span>` : ""}</div></div>
    <div class="actions">
      <label for="mv${d.id}" style="position:absolute;left:-9999px">Move to project</label>
      <select id="mv${d.id}" data-move="${d.id}" title="Move to project">${S.projects.map((x) => `<option value="${x.id}" ${x.id === d.project_id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <button class="icon-btn" aria-label="Edit and teach Hushtype" title="Fix mistakes: Hushtype learns from them" data-edit="${d.id}">${icon("edit", 16)}</button>
      <button class="icon-btn" aria-label="Copy" title="Copy" data-copy="${d.id}">${icon("copy", 16)}</button>
      <button class="icon-btn" aria-label="Delete" title="Delete" data-del="${d.id}">${icon("trash", 16)}</button>
    </div></article>`;
}

function renderHistoryList(el) {
  if (!S.history.length) { el.innerHTML = `<div class="glass list"><p class="empty">${S.hq || S.hlang ? "No dictations match." : "No dictations here yet."}</p></div>`; return; }
  let html = "", day = null, open = false;
  for (const d of S.history) {
    const dl = dayLabel(d.created_at);
    if (dl !== day) { if (open) html += "</div>"; html += `<p class="eyebrow" style="margin-top:6px">${esc(dl)}</p><div class="glass list">`; day = dl; open = true; }
    html += itemHtml(d);
  }
  el.innerHTML = html + (open ? "</div>" : "");
}

async function loadHistory() {
  const inProject = S.view === "project";
  const params = { query: S.hq, language: S.hlang, project_id: inProject ? S.project : (S.hproj ? Number(S.hproj) : null),
    oldest_first: inProject && S.ptab === "combined" };
  S.history = await api().history(params);
  const el = $("#hist"); if (!el) return;
  if (inProject && S.ptab === "combined") {
    const text = S.history.map((d) => d.text).join("\n\n");
    const ur = S.history.length && S.history.every((d) => RTL(d.language));
    el.innerHTML = S.history.length ? `<pre class="glass combined ${ur ? "urdu" : ""}" style="font-family:${ur ? "var(--urdu)" : "var(--font)"}">${esc(text)}</pre>` : `<div class="glass list"><p class="empty">No dictations in this project yet.</p></div>`;
  } else renderHistoryList(el);
}

function viewProjects() {
  return `<header class="top"><div><h1>Projects</h1><p class="sub">Group dictations by what they are for. New dictations go to the active project.</p></div>
    <button class="btn solid" data-new-project>New project</button></header>
    <div class="pgrid">${S.projects.map((p) => `
      <div class="glass pcard" role="button" tabindex="0" data-open-project="${p.id}">
        <h3><span class="pdot" style="background:${PCOLORS[p.color] || PCOLORS.teal};width:12px;height:12px"></span>${esc(p.name)}</h3>
        <div class="row" style="gap:6px">
          ${p.id === S.settings.active_project ? '<span class="chip" style="background:rgba(45,212,191,.25)">Active</span>' : ""}
          <span class="tag ${p.language}">${p.language.toUpperCase()}</span>
          <span class="chip">${p.count} dictation${p.count === 1 ? "" : "s"}</span></div>
        <p class="sub" style="font-size:13px">${p.rules.length ? "Auto: " + p.rules.map(esc).join(", ") : (p.id === 1 ? "Default place for new dictations" : "No app rules")}</p>
      </div>`).join("")}
      <button type="button" class="glass pcard new" data-new-project>+ New project</button>
    </div>`;
}

function viewProject() {
  const p = projectById(S.project);
  return `<header class="top"><div class="row" style="gap:14px">
      <button class="icon-btn" aria-label="Back to projects" data-go="projects">${icon("back", 18)}</button>
      <div><h1 style="display:flex;align-items:center;gap:12px"><span class="pdot" style="background:${PCOLORS[p.color] || PCOLORS.teal};width:14px;height:14px"></span>${esc(p.name)}</h1>
      <p class="sub">${esc(S.options.languages[p.language])} · ${p.remove_fillers ? "fillers removed" : "fillers kept"} · ${p.capitalize ? "auto capitals" : "no auto capitals"}${p.rules.length ? " · auto: " + p.rules.map(esc).join(", ") : ""}</p></div></div>
    <div class="row">
      ${p.id === S.settings.active_project ? '<span class="chip" style="background:rgba(45,212,191,.25)">Active project</span>' : `<button class="btn solid" data-activate="${p.id}">Make active</button>`}
      <button class="btn" data-edit-project="${p.id}">${icon("edit", 16)}Edit</button></div></header>
    <div class="row spread">
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-ptab="list" aria-pressed="${S.ptab === "list"}">Dictations</button>
        <button type="button" data-ptab="combined" aria-pressed="${S.ptab === "combined"}">Combined</button></div>
      ${S.ptab === "combined" ? `<button class="btn solid" data-copy-combined>${icon("copy", 16)}Copy all</button>` : ""}
    </div>
    <div id="hist"><p class="sub">Loading...</p></div>`;
}

function sw(key, label, desc) {
  return `<div class="setting"><div class="label"><b id="l-${key}">${label}</b><span>${desc}</span></div>
    <button type="button" class="switch" aria-labelledby="l-${key}" aria-pressed="${!!S.settings[key]}" data-toggle="${key}"></button></div>`;
}
function sel(key, label, desc, options, extra = "") {
  return `<div class="setting"><div class="label"><label for="s-${key}"><b>${label}</b></label><span>${desc}</span></div>
    <div class="row">${`<select id="s-${key}" data-set="${key}">${Object.entries(options).map(([v, t]) => `<option value="${esc(v)}" ${String(S.settings[key]) === String(v) ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`}${extra}</div></div>`;
}
function modelRow(lang) {
  const m = S.models[lang] || {}, name = S.settings[lang + "_model"], size = S.options.model_sizes[name] || "";
  const status = m.loading ? "downloading or loading now..." : m.on_disk ? "installed" : "not downloaded yet";
  const bar = `<div id="dl-${lang}" style="flex-basis:100%">${downloadBar(lang)}</div>`;
  const btn = !m.on_disk && !m.loading ? `<button class="btn solid" data-download="${lang}">Download</button>` : "";
  return sel(lang + "_model", lang === "ur" ? "Urdu and Punjabi model" : `${S.options.languages[lang]} model`, `${esc(name)} · ${size} · ${status}${m.error ? " · last error: " + esc(m.error) : ""}`, S.options.models[lang], btn).replace(/<\/div>$/, bar + "</div>");
}

function viewLanguages() {
  return `<header class="top"><div><h1>Languages</h1><p class="sub">Download the languages you speak. After the one-time download everything runs offline.</p></div></header>
    <div id="langs"><p class="sub">Loading...</p></div>`;
}

function langCard(L) {
  const exp = L.experimental ? '<span class="chip">Experimental</span>' : "";
  const d = L.download;
  const status = L.loading ? (d ? "Downloading" : "Loading") : L.on_disk ? "Installed" : "Not downloaded";
  const statusChip = `<span class="chip" style="${L.on_disk ? "background:rgba(45,212,191,.25)" : ""}">${status}</span>`;
  const shared = L.shared_with.length ? `<span class="sub" style="font-size:12.5px">Same model as ${L.shared_with.map(esc).join(", ")}</span>` : "";
  const note = L.uses_urdu_model ? '<span class="sub" style="font-size:12.5px">Uses the Urdu model, written in Urdu script</span>' : "";
  const bar = `<div id="lbar-${L.code}">${d ? downloadBar(L.slot) : ""}</div>`;
  const model = L.uses_urdu_model ? "" : `<label for="lm-${L.code}" style="position:absolute;left:-9999px">Quality for ${esc(L.name)}</label>
      <select id="lm-${L.code}" data-lang-model="${L.code}" style="flex:1 1 200px;min-width:0;max-width:100%">${Object.entries(L.options).map(([k, v]) => `<option value="${k}" ${k === L.model ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  const actions = L.loading ? "" : L.on_disk
    ? `<button class="btn" data-lang-remove="${L.code}" ${L.code === "en" ? 'title="English is needed for Auto"' : ""}>Remove</button>`
    : `<button class="btn solid" data-lang-download="${L.code}">Download</button>`;
  return `<div class="glass card" style="gap:12px">
    <div class="row spread"><h2 style="font:600 18px var(--display)">${langLabel(L.code)}</h2><div class="row" style="gap:6px">${exp}${statusChip}</div></div>
    <div class="row" style="gap:10px"><div class="row" style="gap:8px;flex:0 0 auto"><button type="button" class="switch" aria-pressed="${L.enabled}" aria-label="Show ${esc(L.name)} in the language switch" data-lang-enable="${L.code}"></button><span class="sub" style="font-size:13px">In language switch</span></div>${model}</div>
    ${note}${shared}${bar}
    <div class="row">${actions}</div></div>`;
}

async function loadLanguages() {
  const r = await api().languages();
  S.langs = r;
  const el = $("#langs"); if (!el) return;
  const det = r.detector;
  el.innerHTML = `<div class="glass card" style="margin-bottom:16px"><div class="row spread"><div><h2>Auto detection</h2><p class="sub" style="font-size:13px">A small model (${esc(det.size)}) that hears which language you speak, used in Auto mode.</p></div>
      <div class="row">${det.on_disk ? '<span class="chip" style="background:rgba(45,212,191,.25)">Installed</span>' : det.loading ? '<span class="chip">Downloading</span>' : '<button class="btn solid" data-lang-download="auto">Download</button>'}</div></div>
      <div id="lbar-detect">${downloadBar("detect")}</div></div>
    <div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${r.languages.map(langCard).join("")}</div>`;
}
function refreshLanguageBars() {
  for (const [slot] of Object.entries(S.live.downloads || {})) {
    document.querySelectorAll(`[id^="lbar-"]`).forEach((el) => {
      const L = (S.langs && S.langs.languages || []).find((x) => "lbar-" + x.code === el.id);
      if ((L && L.slot === slot) || el.id === "lbar-" + slot) el.innerHTML = downloadBar(slot);
    });
  }
}

function viewSettings() {
  const s = S.settings;
  const mics = { "": "Windows default microphone" };
  for (const m of S.mics) mics[m.name] = m.name + (m.default ? " (Windows default)" : "");
  if (s.mic && !(s.mic in mics)) mics[s.mic] = s.mic + " (not connected)";
  const t = S.test;
  return `<header class="top"><div><h1>Settings</h1><p class="sub">Changes are saved right away.</p></div></header>
  <section class="glass card" aria-labelledby="h-mic"><h2 id="h-mic">Microphone</h2>
    <div class="row"><label for="s-mic" style="position:absolute;left:-9999px">Microphone</label>
      <select id="s-mic" data-set="mic" style="flex:1 1 300px;min-width:0">${Object.entries(mics).map(([v, l]) => `<option value="${esc(v)}" ${s.mic === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      <button class="btn solid" data-test-mic ${t === "running" ? "disabled" : ""}>${t === "running" ? "Listening for 4 seconds..." : "Test microphone"}</button></div>
    <div class="row" style="gap:14px"><span style="font-size:13px;color:var(--muted);width:76px">Input level</span><div class="meter" role="meter" aria-label="Input level"><i id="meter"></i></div></div>
    ${t && t !== "running" ? `<p class="sub">${t.error ? "Problem: " + esc(t.error) : `Heard: <b>${esc(t.text || "(nothing)")}</b>`} ${t.peak != null ? `· peak ${Math.round(t.peak)} dB${t.peak < -40 ? " (too quiet: check the mic or its volume)" : ""}` : ""}</p>` : `<p class="sub">Speak normally: the bar should reach about the middle. Bluetooth headsets often sound worse than the laptop mic.</p>`}
  </section>

  <section class="glass card" aria-labelledby="h-keys" style="gap:0"><h2 id="h-keys" style="margin-bottom:8px">Shortcut and language</h2>
    ${sel("hotkey", "Dictation key", "Hold to record, release to paste", S.options.hotkeys)}
    ${sel("max_seconds", "Longest recording", "Stops by itself and copies the text. Shorter recordings come back faster, especially in Urdu and Punjabi", S.options.max_recording)}

        <label for="add-word" style="position:absolute;left:-9999px">Add a word</label><input id="add-word" type="text" placeholder="Add a word, press Enter" style="border-radius:999px;border-style:dashed;min-height:36px;width:230px"></div></div>

function updateHtml() {
  const u = S.upd || { status: "idle" };
  const btn = (label, attr, solid = true) => `<button class="btn ${solid ? "solid" : ""}" ${attr}>${label}</button>`;
  const intro = `<p class="sub">You have Hushtype ${esc(S.versionStr || "")}. Hushtype only contacts GitHub when you press this button.</p>`;
  if (u.status === "checking") return `<p class="sub">Checking GitHub for a newer version...</p>`;
  if (u.status === "error") return `${intro}<p class="sub" style="color:var(--warn)">${esc(u.error)}</p><div>${btn("Try again", "data-check-update")}</div>`;
  if (u.status === "downloading") {
    const pct = u.total ? Math.round((u.done / u.total) * 100) : 0;
    return `<p class="sub">Downloading Hushtype ${esc(u.latest)}...</p><div class="row" style="gap:12px"><div class="meter"><i style="width:${pct}%"></i></div><span class="mono" style="font-size:12.5px">${pct}% · ${mb(u.done)} / ${mb(u.total)} MB</span></div>`;
  }
  if (u.status === "installing") return `<p class="sub">Installing Hushtype ${esc(u.latest)}. Hushtype will close and reopen in a moment.</p>`;
  if (u.status === "ready") {
    if (!u.latest) return `${intro}<p class="sub">No release has been published yet.</p><div>${btn("Check again", "data-check-update", false)}</div>`;
    if (!u.newer) return `${intro}<p class="sub"><b>You have the latest version.</b></p><div>${btn("Check again", "data-check-update", false)}</div>`;
    return `<p class="sub"><b>Hushtype ${esc(u.latest)} is available.</b> You have ${esc(u.current)}.</p>
      ${u.notes ? `<pre class="glass" style="margin:0;padding:12px 16px;border-radius:14px;white-space:pre-wrap;font:13px/1.6 var(--font);max-height:180px;overflow:auto;user-select:text">${esc(u.notes)}</pre>` : ""}
      <div class="row">${u.can_install ? btn("Download and install", "data-install-update") : ""}${btn("Open the release page", `data-open-url="${esc(u.page)}"`, !u.can_install)}</div>
      ${u.can_install ? '<p class="sub" style="font-size:12.5px">Your settings, history and downloaded models are kept.</p>' : '<p class="sub" style="font-size:12.5px">You are running from source: update with git pull.</p>'}`;
  }
  return `${intro}<div>${btn("Check for updates", "data-check-update")}</div>`;
}
function renderUpdate() { const el = $("#upd"); if (el) el.innerHTML = updateHtml(); }

/* ---------------- dialogs ---------------- */
function dialog(html) {
  $("#layer").innerHTML = `<div class="backdrop" data-close-backdrop><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $("#layer").querySelector("input, select, button"); first && first.focus();
}
const closeDialog = () => { $("#layer").innerHTML = ""; };

function confirmDialog(title, body, okLabel, onOk, danger = true) {
  dialog(`<h2>${esc(title)}</h2><p class="sub">${esc(body)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger" : "solid"}" id="ok">${esc(okLabel)}</button></div>`);
  $("#ok").onclick = async () => { closeDialog(); await onOk(); };
}

function projectDialog(p) {
  const isNew = !p; p = p || { name: "", language: activeProject().language, remove_fillers: true, capitalize: true, rules: [] };
  dialog(`<h2>${isNew ? "New project" : "Edit project"}</h2>
    <div class="field"><label for="pn">Name</label><input id="pn" type="text" value="${esc(p.name)}" placeholder="e.g. Email, Work, Poetry" ${p.id === 1 ? "" : ""}></div>
    <div class="field"><label for="pl">Language</label><select id="pl"><option value="auto" ${p.language === "auto" ? "selected" : ""}>Auto (hears which language)</option>${enabledLangs().map((l) => `<option value="${l}" ${p.language === l ? "selected" : ""}>${esc(langName(l))}${(S.options.experimental || []).includes(l) ? " (experimental)" : ""}</option>`).join("")}</select></div>
    <div class="setting"><div class="label"><b id="l-pf">Remove filler words</b><span>"um", "uh" (English only)</span></div><button type="button" class="switch" aria-labelledby="l-pf" id="pf" aria-pressed="${p.remove_fillers}"></button></div>
    <div class="setting"><div class="label"><b id="l-pc">Capitalise sentences</b><span>Turn off for poetry or casual chat</span></div><button type="button" class="switch" aria-labelledby="l-pc" id="pc" aria-pressed="${p.capitalize}"></button></div>
    <div class="field"><label for="pr">Auto-file from these apps (optional)</label><input id="pr" type="text" value="${esc(p.rules.join(", "))}" placeholder="e.g. outlook, gmail"><span class="sub" style="font-size:12.5px">When you dictate in a window whose app or title contains one of these words, it goes to this project.</span></div>
    <div class="row spread">${!isNew && p.id !== 1 ? `<button class="btn danger" id="pdel">Delete project</button>` : "<span></span>"}
      <div class="row"><button class="btn" data-close>Cancel</button><button class="btn solid" id="psave">${isNew ? "Create" : "Save"}</button></div></div>`);
  for (const id of ["pf", "pc"]) $("#" + id).onclick = (e) => e.currentTarget.setAttribute("aria-pressed", e.currentTarget.getAttribute("aria-pressed") !== "true");
  $("#psave").onclick = async () => {
    const data = { name: $("#pn").value.trim() || "Untitled", language: $("#pl").value,
      remove_fillers: $("#pf").getAttribute("aria-pressed") === "true", capitalize: $("#pc").getAttribute("aria-pressed") === "true",
      rules: $("#pr").value.split(",").map((s) => s.trim()).filter(Boolean) };
    const saved = isNew ? await api().create_project(data) : await api().update_project(p.id, data);
    closeDialog(); await refreshData(); toast(isNew ? "Project created" : "Project saved");
    if (isNew) go("project", { project: saved.id, ptab: "list" }); else render();
  };
  const del = $("#pdel");
  if (del) del.onclick = () => confirmDialog(`Delete "${p.name}"?`, "Its dictations move to the Inbox. Nothing is lost.", "Delete project", async () => {
    await api().delete_project(p.id); await refreshData(); toast("Project deleted"); go("projects"); });
}

window.hushtype = {
  askCleanup(n) {
    dialog(`<div style="width:48px;height:48px;border-radius:16px;background:var(--w18);border:1px solid var(--w30);display:flex;align-items:center;justify-content:center">${icon("history", 22)}</div>
      <h2>Clean up your history?</h2><p class="sub">You have ${n} dictation${n === 1 ? "" : "s"} older than ${S.settings.review_days} days. Delete ${n === 1 ? "it" : "them"} to keep only recent ones on your laptop.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="keep">Keep for now</button><button class="btn solid" id="cdel">Delete ${n} dictation${n === 1 ? "" : "s"}</button></div>
      <button class="btn ghost" style="align-self:flex-start;padding:0" id="review">Review them first</button>`);
    $("#keep").onclick = async () => { await api().cleanup(false); closeDialog(); toast("Kept. Hushtype will ask again later."); };
    $("#cdel").onclick = async () => { const d = await api().cleanup(true); closeDialog(); await refreshData(); toast(`Deleted ${d} old dictation${d === 1 ? "" : "s"}`); render(); };
    $("#review").onclick = () => { closeDialog(); go("history"); };
  },
};

/* ---------------- events ---------------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-edit],[data-save-edit],[data-cancel-edit],[data-forget],[data-lang-download],[data-lang-remove],[data-lang-enable],[data-record],[data-check-update],[data-install-update],[data-open-url],[data-go],[data-lang],[data-copy],[data-copy-last],[data-del],[data-clear-all],[data-hlang],[data-new-project],[data-open-project],[data-edit-project],[data-activate],[data-ptab],[data-copy-combined],[data-toggle],[data-download],[data-test-mic],[data-rm-word],[data-add-snip],[data-rm-snip],[data-open-folder],[data-close],[data-close-backdrop]");
  if (!t) return;
  const d = t.dataset;
  if ("closeBackdrop" in d) { if (e.target === t) closeDialog(); return; }
  if ("close" in d) return closeDialog();
  if (d.go) return go(d.go);
  if (d.lang) { await api().set_language(d.lang); await refreshData(); render(); toast(`${activeProject().name}: ${S.options.languages[d.lang]}`); return; }
  if ("copyLast" in d) { await api().copy(S.last.text); return toast("Copied"); }
  if (d.edit) {
    const it = S.history.find((x) => x.id === Number(d.edit)); const body = $("#body-" + it.id); if (!body) return;
    const p = body.querySelector(".text");
    p.outerHTML = `<div class="field" style="gap:8px"><label for="ed-${it.id}" style="position:absolute;left:-9999px">Corrected text</label>
      <textarea id="ed-${it.id}" rows="3" dir="${RTL(it.language) ? "rtl" : "ltr"}" class="${RTL(it.language) ? "urdu" : ""}" style="width:100%">${esc(it.text)}</textarea>
      <div class="row"><button class="btn solid" data-save-edit="${it.id}">Save and copy</button><button class="btn ghost" data-cancel-edit>Cancel</button>
      <span class="sub" style="font-size:12.5px">Fix wrong words: Hushtype learns them for next time.</span></div></div>`;
    const ta = $("#ed-" + it.id); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  if (d.saveEdit) {
    const ta = $("#ed-" + d.saveEdit);
    const r = await api().edit_item(Number(d.saveEdit), ta.value);
    await refreshData(); loadHistory();
    return toast(r.learned.length ? `Saved and copied. Learned: ${r.learned.map((x) => `${x.wrong} → ${x.right}`).join(", ")}` : "Saved and copied");
  }
  if ("cancelEdit" in d) { loadHistory(); return; }
  if (d.forget) { const [kind, key] = d.forget.split(":", 2); S.settings = await api().forget_learned(kind, key); render(); return toast("Forgotten"); }
  if (d.copy) { const it = S.history.find((x) => x.id === Number(d.copy)); await api().copy(it.text); return toast("Copied"); }
  if (d.del) { await api().delete_item(Number(d.del)); await refreshData(); loadHistory(); return toast("Deleted"); }
  if ("clearAll" in d) return confirmDialog("Delete all history?", "This removes every saved dictation from this laptop. It cannot be undone.", "Delete all", async () => { const n = await api().clear_history(); await refreshData(); render(); toast(`Deleted ${n} dictations`); });
  if ("hlang" in d) { S.hlang = d.hlang; render(); return; }
  if ("newProject" in d) return projectDialog(null);
  if (d.openProject) return go("project", { project: Number(d.openProject), ptab: "list", hq: "", hlang: "" });
  if (d.editProject) return projectDialog(projectById(Number(d.editProject)));
  if (d.activate) { await api().set_active_project(Number(d.activate)); await refreshData(); render(); return toast("Active project changed"); }
  if (d.ptab) { S.ptab = d.ptab; render(); return; }
  if ("copyCombined" in d) { await api().copy(S.history.map((x) => x.text).join("\n\n")); return toast("Copied the whole project"); }
  if (d.toggle) { const v = t.getAttribute("aria-pressed") !== "true"; t.setAttribute("aria-pressed", v); S.settings = await api().set_settings({ [d.toggle]: v }); return; }
  if (d.download) { await api().download_model(d.download); toast("Download started. You can keep working."); setTimeout(refreshModels, 500); return; }
  if ("testMic" in d) { S.test = "running"; render(); const r = await api().test_mic(4); S.test = r; if (S.view === "settings") render(); return; }
  if (d.rmWord) { const v = [...S.settings.vocabulary]; v.splice(Number(d.rmWord), 1); S.settings = await api().set_settings({ vocabulary: v }); render(); return; }
  if ("addSnip" in d) { const sn = { ...S.settings.snippets }; let k = "new snippet", i = 2; while (k in sn) k = `new snippet ${i++}`; sn[k] = ""; S.settings = await api().set_settings({ snippets: sn }); render(); return; }
  if (d.rmSnip) { const e2 = Object.entries(S.settings.snippets); e2.splice(Number(d.rmSnip), 1); S.settings = await api().set_settings({ snippets: Object.fromEntries(e2) }); render(); return; }
  if ("openFolder" in d) return api().open_data_folder();
  if (d.langDownload) { await api().download_language(d.langDownload); toast("Download started. You can keep working."); setTimeout(loadLanguages, 600); return; }
  if (d.langRemove) {
    const L = S.langs.languages.find((x) => x.code === d.langRemove);
    const also = L.shared_with.length ? ` It is also used by ${L.shared_with.join(", ")}, which will need it downloaded again.` : "";
    return confirmDialog(`Remove ${L.name}?`, `This deletes its model from your laptop to free space.${also} You can download it again any time.`, "Remove", async () => {
      const r = await api().remove_language(L.code); S.langs = r.languages; loadLanguages(); toast(`Freed ${Math.round(r.freed / 1e6)} MB`); });
  }
  if (d.langEnable) {
    const on = t.getAttribute("aria-pressed") !== "true";
    t.setAttribute("aria-pressed", on);
    await api().set_language_enabled(d.langEnable, on); await refreshData(); renderNav(); loadLanguages();
    return toast(on ? `${langName(d.langEnable)} added to the language switch` : `${langName(d.langEnable)} hidden from the language switch`);
  }
  if ("record" in d) { t.disabled = true; await api().toggle_recording(); return; }  // the live poll redraws it
  if ("checkUpdate" in d) { S.upd = { status: "checking" }; renderUpdate(); S.upd = await api().check_update(); renderUpdate(); return; }
  if ("installUpdate" in d) {
    S.upd = await api().install_update(); renderUpdate();
    const timer = setInterval(async () => { S.upd = await api().update_status(); renderUpdate(); if (S.upd.status === "error") clearInterval(timer); }, 400);
    return;
  }
  if (d.openUrl) return api().open_url(d.openUrl);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#layer").innerHTML) closeDialog();
  const card = e.target.closest && e.target.closest("[data-open-project]");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); card.click(); }
  if (e.target.id === "add-word" && e.key === "Enter" && e.target.value.trim()) {
    const v = [...S.settings.vocabulary, e.target.value.trim()];
    api().set_settings({ vocabulary: v }).then((s) => { S.settings = s; render(); setTimeout(() => $("#add-word") && $("#add-word").focus(), 0); });
  }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.matches("[data-active-project]")) { await api().set_active_project(Number(t.value)); await refreshData(); render(); return toast(`Active project: ${activeProject().name}`); }
  if (t.dataset.set) {
    let v = t.value; if (t.dataset.set === "review_days" || t.dataset.set === "max_seconds") v = Number(v);
    S.settings = await api().set_settings({ [t.dataset.set]: v });
    if (t.dataset.set.endsWith("_model")) await refreshModels();
    render(); return toast("Saved");
  }
  if (t.dataset.langModel) {
    await api().set_language_model(t.dataset.langModel, t.value); await refreshData(); loadLanguages();
    return toast("Quality changed. Download it if it is not installed yet.");
  }
  if (t.dataset.move) { await api().move_item(Number(t.dataset.move), Number(t.value)); await refreshData(); loadHistory(); return toast(`Moved to ${projectById(Number(t.value)).name}`); }
  if (t.id === "hproj") { S.hproj = t.value; loadHistory(); }
  if (t.dataset.snipKey !== undefined || t.dataset.snipVal !== undefined) {
    const keys = [...document.querySelectorAll("[data-snip-key]")].map((x) => x.value.trim().toLowerCase());
    const vals = [...document.querySelectorAll("[data-snip-val]")].map((x) => x.value);
    const sn = {}; keys.forEach((k, i) => { if (k) sn[k] = vals[i]; });
    S.settings = await api().set_settings({ snippets: sn }); toast("Snippet saved");
  }
});
let searchTimer;
document.addEventListener("input", (e) => {
  if (e.target.id === "hq") { S.hq = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(loadHistory, 200); }
});

/* ---------------- data & live updates ---------------- */
async function refreshData() {
  const r = await api().stats();
  S.stats = r.stats; S.last = r.last; S.projects = r.projects; S.settings = r.settings;
}
async function refreshModels() { S.models = await api().models(); if (S.view === "settings") render(); }

let meterTimer = null;
function startMeter() {
  if (meterTimer) return;
  api().mics().then((m) => { const had = S.mics.length; S.mics = m; if (!had && m.length && S.view === "settings") render(); });
  meterTimer = setInterval(async () => { const el = $("#meter"); if (!el) return; const lvl = await api().mic_level(); el.style.width = Math.round(lvl * 100) + "%"; }, 120);
}
function stopMeter() { clearInterval(meterTimer); meterTimer = null; }

async function poll() {
  try {
    const prev = S.live ? S.live.state : null;
    S.live = await api().live();
    renderSideStatus();
    applyTheme();
    if (S.view === "home" && S.live.state === "model") { const hero = $("#hero"); if (hero) hero.innerHTML = heroContent(); }
    if (S.view === "languages" && S.live.downloads && Object.keys(S.live.downloads).length) refreshLanguageBars();
    if (S.view === "languages" && prev && prev !== S.live.state && (prev === "model" || S.live.state === "model")) loadLanguages();
    if (S.view === "home") {
      if (prev !== S.live.state) {
        const hero = $("#hero"), orb = $("#orb");
        if (hero) hero.innerHTML = heroContent();
        if (orb) {
          orb.className = "orb " + (S.live.state === "recording" ? "rec" : (S.live.state === "working" || S.live.state === "model") ? "busy" : "");
          orb.innerHTML = orbInner();
          orb.disabled = !["idle", "recording"].includes(S.live.state);
          orb.setAttribute("aria-label", S.live.state === "recording" ? "Stop recording" : "Start recording");
        }
      } else if (S.live.state === "recording") {
        const tm = $("#hero-timer"); if (tm) tm.textContent = fmtDur(S.live.elapsed);
        const left = $("#hero-left"); if (left) left.outerHTML = countdownHtml(S.live);
      }
    }
    if (S.live.version !== S.version) {
      S.version = S.live.version; await refreshData();
      if (S.view === "home" || S.view === "projects") render();
      else if (S.view === "history" || S.view === "project") loadHistory();
    }
    if (prev && prev !== S.live.state && (prev === "model" || S.live.state === "model")) refreshModels();
  } catch (err) { console.error(err); }
  setTimeout(poll, S.live && S.live.state === "recording" ? 200 : 400);
}

async function boot() {
  const b = await api().bootstrap();
  Object.assign(S, { settings: b.settings, options: b.options, projects: b.projects, stats: b.stats, last: b.last, models: b.models, dataDir: b.data_dir, versionStr: `${b.version} (${b.build})` });
  renderNav(); render(); poll();
  const n = await api().cleanup_due(); if (n) window.hushtype.askCleanup(n);
}
