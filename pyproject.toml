[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hushtype"
version = "0.1.0"
description = "Local, offline push-to-talk dictation for Windows using Whisper."
requires-python = ">=3.11,<3.15"
dependencies = [
    "faster-whisper>=1.1",
    "av<16",  # av 16+ breaks faster-whisper audio decoding
    "numpy",
    "sounddevice",
    "pynput",
    "pyperclip",
    "pystray",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hushtype = "hushtype.app:main"

[tool.setuptools]
packages = ["hushtype"]
