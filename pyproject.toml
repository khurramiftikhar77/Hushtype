[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hushtype"
version = "0.1.0"
description = "Local, offline push-to-talk dictation for Windows using Whisper."
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Exact versions, so a compromised or broken future release of a library
    # cannot slip into a build. Upgrade on purpose, then test.
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.0",
    "onnxruntime==1.32.0",
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",
    "av==15.1.0",  # av 16+ breaks faster-whisper audio decoding
    "numpy==2.5.4",
    "sounddevice==0.5.6",
    "pynput==1.8.2",
    "pyperclip==1.11.0",
    "pystray==0.19.5",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hushtype = "hushtype.app:main"

[tool.setuptools]
packages = ["hushtype"]
