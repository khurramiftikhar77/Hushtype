name: Build Windows installer

# Every push builds and tests the installer (download it from the run's
# Artifacts). A push to main with a new version number also publishes it as
# a GitHub Release, which the app's update button installs.
on:
  push:
    branches: [main, gui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.9

      - name: Run tests
        run: python -m pytest -q

      - name: Stamp the build number
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Set-Content -Path hushtype/_build.py -Value "BUILD = 'build ${{ github.run_number }}, $sha'"
          Get-Content hushtype/_build.py

      - name: Build the app
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/hushtype.spec

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Hushtype\Hushtype.exe" -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          "### Self-test of the packaged app" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content selftest.txt >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import hushtype; print(hushtype.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $env:HUSHTYPE_VERSION = "${{ steps.version.outputs.version }}"
          & $iscc /Q packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\Hushtype-Setup-*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: Hushtype-Setup-${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: dist/Hushtype-Setup-*.exe
          retention-days: 30

      - name: Is this version already released?
        id: released
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $found = git ls-remote --tags origin "refs/tags/$tag"
          "exists=$([bool]$found)".ToLower() >> $env:GITHUB_OUTPUT
          if ($found) { "Version $tag is already released; not publishing again." } else { "Publishing $tag." }

      # A new version number on main publishes a release (the app's update
      # button reads it). Bump the version in hushtype/__init__.py and
      # pyproject.toml to release; other pushes to main only build.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hushtype ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/Hushtype-Setup-*.exe
          generate_release_notes: true
